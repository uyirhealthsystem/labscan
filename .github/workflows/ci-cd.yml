name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ CI ----
  test:
    name: Typecheck + build + API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labscan_test
      PORT: "8082"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Start service
        run: |
          node dist/server.js > service.log 2>&1 &
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8082/health

      - name: API tests (Postman collection)
        run: |
          npx --yes newman@6 run docs/labscan-lab-scan.postman_collection.json \
            --env-var baseUrl=http://127.0.0.1:8082 \
            --env-var userId=00000000-0000-4000-8000-000000000001 \
            --reporters cli

      - name: Service log
        if: always()
        run: cat service.log || true

  # -------------------------------------------------------------- Deploy ----
  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      # prisma7.config.ts requires DATABASE_URL to be set; generate/build never connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build release
        run: |
          npx prisma generate --config prisma7.config.ts
          npm run build

      # dist/ already contains the compiled Prisma client and node_modules is
      # shipped pre-installed, so the EC2 host never runs tsc or `npm ci`
      # (a full install there gets OOM-killed - exit 137 - on a small instance).
      - name: Prune to production dependencies
        run: npm prune --omit=dev --ignore-scripts

      - name: Assemble release bundle
        run: |
          rm -rf release
          mkdir -p release
          cp -a dist node_modules package.json package-lock.json prisma prisma7.config.ts release/
          cp -a deploy release/deploy

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release to EC2
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'rm -rf /opt/labscan/releases/next && mkdir -p /opt/labscan/releases/next'
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            release/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/labscan/releases/next/"

      - name: Activate release (install, migrate, restart, health check)
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' < deploy/remote-release.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
