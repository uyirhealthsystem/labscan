name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    env:
      # prisma7.config.ts resolves DATABASE_URL at config-load time; `prisma generate`
      # and `tsc` never connect to it, so a placeholder is enough for CI.
      DATABASE_URL: "postgresql://user:password@localhost:5432/labscan"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (tsc)
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: build
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 18m
          script: |
            set -e

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            REPO_SLUG="${{ github.repository }}"

            echo "== Ensuring system dependencies =="
            if command -v apt-get >/dev/null 2>&1; then
              PKG_MGR=apt
              sudo apt-get update -y
            elif command -v dnf >/dev/null 2>&1; then
              PKG_MGR=dnf
            elif command -v yum >/dev/null 2>&1; then
              PKG_MGR=yum
            else
              echo "ERROR: no supported package manager found (apt-get/dnf/yum) on this host." >&2
              exit 1
            fi
            echo "Detected package manager: $PKG_MGR"

            if ! command -v node >/dev/null 2>&1; then
              echo "Installing Node.js 22..."
              if [ "$PKG_MGR" = "apt" ]; then
                curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
              else
                curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo -E bash -
                sudo "$PKG_MGR" install -y nodejs
              fi
            fi

            if ! command -v git >/dev/null 2>&1; then
              if [ "$PKG_MGR" = "apt" ]; then
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git
              else
                sudo "$PKG_MGR" install -y git
              fi
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "== Ensuring app checkout at $APP_DIR =="
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "No checkout found — cloning fresh..."
              mkdir -p "$APP_DIR"
              git clone "https://x-access-token:${{ github.token }}@github.com/$REPO_SLUG.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            PREV_COMMIT="$(git rev-parse HEAD 2>/dev/null || echo "")"

            echo "Fetching latest main..."
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/$REPO_SLUG.git"
            git fetch origin main
            git reset --hard origin/main
            # Don't leave the short-lived job token sitting in .git/config after we're done with it.
            git remote set-url origin "https://github.com/$REPO_SLUG.git"

            echo "== Writing .env from the APP_ENV_FILE secret =="
            cat > .env <<'ENV_EOF'
            ${{ secrets.APP_ENV_FILE }}
            ENV_EOF

            echo "Installing dependencies..."
            npm ci
            npx prisma generate

            echo "Applying database migrations..."
            npx prisma migrate deploy

            echo "Building..."
            npm run build

            echo "Reloading app under PM2..."
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save

            set -a
            . ./.env
            set +a
            PORT="${PORT:-8082}"

            echo "Waiting for the app to become healthy on port $PORT..."
            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:$PORT/health" > /dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -eq 1 ]; then
              echo "Deploy succeeded — app is healthy."
              exit 0
            fi

            echo "Health check failed after deploy." >&2

            if [ -n "$PREV_COMMIT" ]; then
              echo "Rolling back to $PREV_COMMIT" >&2
              git reset --hard "$PREV_COMMIT"
              npm ci
              npx prisma generate
              npm run build
              pm2 startOrReload ecosystem.config.js --update-env
              pm2 save
              echo "Rolled back code/app to $PREV_COMMIT. NOTE: any DB migrations applied during the failed deploy were NOT auto-reverted — check them manually." >&2
            else
              echo "No previous commit available — this was the first deploy, nothing to roll back to." >&2
            fi

            exit 1
